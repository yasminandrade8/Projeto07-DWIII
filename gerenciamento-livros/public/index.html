<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Literária - Gerenciamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>📚 Sistema de Gerenciamento de Livros</h1>
        <p>Organize seu acervo, acompanhe suas leituras e consulte a Open Library.</p>
    </header>

    <main class="container">
        <div id="mensagem" class="mensagem hidden"></div>

        <section class="card busca-api-section">
            <h2>🔍 Consultar na Open Library</h2>
            <div class="busca-group">
                <input type="text" id="inputBuscaExterna" placeholder="Digite o título do livro para buscar na Open Library...">
                <button id="btnBuscarExterna" type="button">Buscar na API</button>
            </div>
            <div id="resultadoBuscaExterna" class="resultado-busca hidden"></div>
        </section>

        <section class="card form-section">
            <h2 id="formTitulo">Cadastrar Novo Livro</h2>
            <form id="formLivro">
                <input type="hidden" id="livroId">
                <input type="hidden" id="livroCapa">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título *</label>
                        <input type="text" id="titulo" required>
                    </div>
                    <div class="form-group">
                        <label for="autor">Autor *</label>
                        <input type="text" id="autor" required>
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN *</label>
                        <input type="text" id="isbn" required>
                    </div>
                    <div class="form-group">
                        <label for="anoPublicacao">Ano de Publicação *</label>
                        <input type="number" id="anoPublicacao" required>
                    </div>
                    <div class="form-group">
                        <label for="genero">Gênero Literário *</label>
                        <input type="text" id="genero" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status de Leitura *</label>
                        <select id="status" required>
                            <option value="Quero ler">Quero ler</option>
                            <option value="Lendo">Lendo</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btnSalvar" class="btn-primary">Cadastrar Livro</button>
                    <button type="button" id="btnCancelar" class="btn-secondary hidden">Cancelar Edição</button>
                </div>
            </form>
        </section>

        <section class="card list-section">
            <div class="list-header">
                <h2>Acervo Cadastrado</h2>
                <input type="text" id="inputFiltroLocal" placeholder="Filtrar livros cadastrados...">
            </div>
            <div id="listaLivros" class="grid-livros">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
